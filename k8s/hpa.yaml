# This runs only in a disposable Kind namespace. HPA is not equivalent to
# the original company's internal autoscaling implementation.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: metadata-cpu
  namespace: oncall-lab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: metadata
  minReplicas: 6
  maxReplicas: 9
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 3
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 3
          periodSeconds: 30

apiVersion: 1
datasources:
- name: Prometheus
  type: prometheus
  uid: prom
  access: proxy
  isDefault: true
  url: http://prometheus:9090
- name: Loki
  type: loki
  uid: loki
  access: proxy
  url: http://loki:3100
  jsonData:
    maxLines: 1000
    derivedFields:
    - datasourceUid: tempo
      matcherRegex: '"trace_id":"([0-9a-f]{32})"'
      name: TraceID
      url: $${__value.raw}
      urlDisplayLabel: View trace in Tempo
- name: Tempo
  type: tempo
  uid: tempo
  access: proxy
  url: http://tempo:3200

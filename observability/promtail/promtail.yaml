server:
  http_listen_port: 9080
  grpc_listen_port: 0
positions:
  filename: /tmp/positions.yaml
clients:
  - url: http://loki:3100/loki/api/v1/push
scrape_configs:
  - job_name: oncall-lab-json
    pipeline_stages:
      - json:
          expressions:
            zone: zone
            instance: instance
            result: result
            trace_id: trace_id
      - labels:
          zone:
          instance:
          result:
    static_configs:
      - targets: [localhost]
        labels:
          job: oncall-lab
          __path__: /var/log/oncall/*.jsonl

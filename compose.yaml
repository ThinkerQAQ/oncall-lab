name: oncall-lab
services:
  metadata:
    image: oncall-lab-metadata:local
    build:
      context: .
      args:
        TARGET: metadata
    environment:
      RPC_LISTEN: ":8888"
      METRICS_LISTEN: ":9091"
      OTEL_EXPORTER_ENDPOINT: "tempo:4317"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  gateway:
    image: oncall-lab-gateway:local
    build:
      context: .
      args:
        TARGET: gateway
    depends_on:
      metadata:
        condition: service_healthy
    environment:
      HTTP_LISTEN: ":8080"
      METADATA_RPC_ADDR: "metadata:8888"
      OTEL_EXPORTER_ENDPOINT: "tempo:4317"
    ports:
      - "127.0.0.1:28080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  loadgen:
    image: oncall-lab-loadgen:local
    profiles: ["traffic"]
    build:
      context: .
      args:
        TARGET: loadgen
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      GATEWAY_URL: "http://gateway:8080/metadata"
      QPS: "10"
      DURATION_SECONDS: "45"
      DELAY_MS: "0"
    restart: "no"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=12h"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:23090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_USER: "demo"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_PLUGINS_PREINSTALL: ""
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo
    ports:
      - "127.0.0.1:23000:3000"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.3
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "127.0.0.1:23100:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    ports:
      - "127.0.0.1:23200:3200"
    restart: unless-stopped
